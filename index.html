<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야자 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 레이아웃: 밤의 학교 복도를 손전등으로 비추며 걷는 캔버스 + 옆(모바일은 아래) 진행 수첩. 단일 다크 룩. */
:root{
  color-scheme: dark;
  --bg:#12141c;          /* 꺼진 복도 */
  --panel:#1c1f2b;
  --raise:#252938;
  --line:#363b50;
  --fg:#e9e6dc;
  --muted:#a3a29a;
  --chalk:#e9e6dc;
  --lamp:#f2d27a;        /* 손전등 */
  --exit:#4fd18b;        /* 비상구 초록 */
  --ghost:#b9c8ff;       /* 귀신 */
  --bad:#ef8a78;
  --ok:#7fcf95;
  --f-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-body:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:12px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:.02em}
h1 span{color:var(--exit)}
.sub{color:var(--muted);font-size:14px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--lamp)}
.teacher{background:var(--lamp);color:#1a1608;font-size:13px;padding:5px 12px;border-radius:4px}

main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:920px){main{grid-template-columns:minmax(0,1fr)}}

.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.screen{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#07080c}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}
.where{position:absolute;left:10px;top:10px;background:rgba(7,8,12,.75);border:1px solid var(--line);border-radius:4px;padding:2px 10px;font-size:13px;font-family:var(--f-mono)}
.talk{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:rgba(14,17,30,.94);border:1px solid var(--ghost);border-radius:10px;padding:10px 14px 10px 14px;font-size:15px;box-shadow:0 0 24px rgba(185,200,255,.18);display:flex;gap:10px;align-items:flex-start}
.talk .who{font-family:var(--f-display);color:var(--ghost);white-space:nowrap}
.talk p{margin:0;flex:1}
.talk button{background:none;border:0;color:var(--muted);font-size:13px;padding:0 2px}
.pad{position:absolute;left:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px;opacity:.9}
.pad button{background:rgba(7,8,12,.7);border:1px solid var(--line);border-radius:6px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.act{position:absolute;right:12px;bottom:12px;background:var(--lamp);color:#1a1608;border:0;border-radius:28px;padding:14px 24px;font-size:18px;font-weight:700;max-width:60%;box-shadow:0 0 0 3px rgba(242,210,122,.35),0 4px 0 rgba(0,0,0,.4)}
.act:disabled{background:rgba(7,8,12,.7);color:var(--muted);border:1px solid var(--line)}
@media (pointer:fine){.pad{display:none}}
@media (max-width:600px){.pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);opacity:.6}.act{font-size:15px;padding:10px 16px;bottom:8px;right:8px}.where{font-size:12px}}
.helpline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px;color:var(--muted)}
.helpline kbd{font-family:var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:12px;color:var(--fg)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.places button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:15px}
.places button[data-s=done]{border-color:var(--ok);color:var(--ok)}
.places button[data-s=lock]{color:var(--muted);opacity:.7}
.places button[data-s=next]{border-color:var(--lamp);color:var(--lamp)}

.note{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.note h3{font-size:13px;color:var(--muted);margin:0;font-weight:400;letter-spacing:.06em}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.route li{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:baseline;font-size:14px}
.route li i{font-style:normal;font-family:var(--f-mono);color:var(--muted)}
.route li small{color:var(--muted);font-size:12px}
.route li.done i{color:var(--ok)}
.route li.next{color:var(--lamp)}
.route li.lock{color:var(--muted)}
.charms{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.charm{width:22px;height:32px;background:url(assets/obj_charm.png) center/contain no-repeat}
.hero{width:100%;height:auto;aspect-ratio:1280/714;object-fit:cover;border-radius:6px;display:block;background:#1c1f2b}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:4px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:400}
.btn.hot{background:var(--exit);color:#08140d}
.btn.charmbtn{background:#e8d27a;color:#5a1d16}
.btn:disabled{opacity:.4;cursor:not-allowed}

.overlay{position:fixed;inset:0;background:rgba(4,5,9,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(700px,100%);max-height:calc(100% - 24px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--lamp);font-family:var(--f-mono)}
.say{color:var(--muted);font-size:15px;margin:0}
.story{display:flex;flex-direction:column;gap:6px;font-size:16px}
.story p{margin:0}
.chalk{background:#20352b;color:var(--chalk);border:6px solid #5b4330;border-radius:4px;padding:14px 16px;font-size:16px}
.word{font-family:var(--f-display);font-size:clamp(24px,5vw,40px);line-height:1.3;text-align:center;margin:2px 0;text-wrap:balance}
.word u{text-decoration-color:var(--lamp);text-decoration-thickness:3px;text-underline-offset:6px}
.ctx{text-align:center;color:var(--muted);font-size:15px;margin:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:16px;font-weight:700;text-align:left}
.choice:hover:not(:disabled){border-color:var(--lamp)}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--raise))}
.choice.wrong{border-color:var(--bad);opacity:.6}
.choice.gone{opacity:.25;text-decoration:line-through}
.choice.key::after{content:" ✓";color:var(--lamp)}
.fb{border-radius:6px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.tag{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.gline{align-self:flex-start;background:rgba(185,200,255,.08);border:1px solid rgba(185,200,255,.4);border-radius:14px 14px 14px 2px;padding:8px 12px;font-size:14px;color:var(--ghost)}
.hint{font-size:14px;color:var(--lamp);border-left:3px solid var(--lamp);padding-left:10px;margin:0}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;background:var(--line);border-radius:2px}
.dots i.on{background:var(--lamp)}
.cert{border:2px solid var(--exit);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.cert dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-variant-numeric:tabular-nums}
.cert dt{color:var(--muted)}
.cert dd{margin:0}
input[type=text],textarea{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--fg);font:inherit}
textarea{min-height:64px;resize:vertical}
label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ghostbox{display:flex;gap:16px;align-items:center}
.gface{width:96px;height:auto;flex:none;filter:drop-shadow(0 0 12px rgba(185,200,255,.7))}
.gsay{font-size:18px;line-height:1.6;color:var(--ghost);margin:4px 0 0}
.gopts{display:flex;flex-direction:column;gap:8px}
.gopts .btn{text-align:left;font-size:16px;padding:12px 16px}
.riddle{font-size:17px;line-height:1.8}
.dials{display:grid;gap:8px}
.dial{background:#0d0f16;border:1px solid var(--line);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dial span{font-size:14px;color:var(--muted)}
.dial .n{font-family:var(--f-mono);font-size:40px;color:var(--lamp);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.dial button{background:var(--raise);border:1px solid var(--line);border-radius:6px;width:52px;height:38px;font-size:16px}
.answer input{font-size:20px;padding:12px 14px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>야자 <span>탈출</span></h1>
      <p class="sub">화법과 언어 · 문법 방탈출 · 본관 3·4층</p>
    </div>
    <div class="stats">
      <span>교실 <b id="stRooms">0/7</b></span>
      <span>부적 <b id="stCharm">0</b></span>
      <span>경과 <b id="stClock">00:00</b></span>
    </div>
    <span class="teacher" id="teacherBadge" hidden>교사 모드 · 문 모두 열림 · 정답 표시 · 기록 저장 안 함</span>
  </header>

  <main>
    <section class="stage" aria-label="학교">
      <div class="screen">
        <canvas id="cv" width="1280" height="768" tabindex="0" aria-label="학교 지도. 방향키나 WASD로 움직이고 E로 살펴요."></canvas>
        <span class="where" id="where">2-3반</span>
        <div class="talk" id="talk" hidden><span class="who">야자 귀신</span><p id="talkText"></p><button id="talkX" aria-label="닫기">닫기</button></div>
        <div class="pad" id="pad" aria-hidden="true">
          <button class="u" data-dir="up">▲</button><button class="l" data-dir="left">◀</button>
          <button class="r" data-dir="right">▶</button><button class="d" data-dir="down">▼</button>
        </div>
        <button class="act" id="actBtn" disabled>살필 것 없음</button>
      </div>
      <div class="helpline"><span><kbd>방향키</kbd>·<kbd>WASD</kbd> 이동 &nbsp; <kbd>E</kbd>·<kbd>Enter</kbd> 살피기 &nbsp; 화면을 누르면 그곳으로 걸어가요</span></div>
      <div class="helpline"><span>이 층의 장소</span><div class="places" id="places"></div></div>
    </section>

    <aside class="note" aria-label="탈출 수첩">
      <h2>탈출 수첩</h2>
      <h3>꼭 풀어야 하는 교실</h3>
      <ul class="route" id="route"></ul>
      <h3>부적 (특별실·화장실에서 얻어요)</h3>
      <div class="charms" id="charms"></div>
      <div class="log" id="log"></div>
      <div class="btnrow"><button class="btn ghost" id="resetBtn">처음부터 다시</button></div>
    </aside>
  </main>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>

</body>
</html>
